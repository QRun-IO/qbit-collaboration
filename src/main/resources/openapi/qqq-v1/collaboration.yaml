          nullable: true
          type: "string"
        editedByDisplayName:
          description: "Editor display name."
          nullable: true
          type: "string"
        editedByUserId:
          description: "Editor identity."
          nullable: true
          type: "string"
        id:
          description: "Revision identifier."
          nullable: true
          type: "integer"
      type: "object"
    CollaborationCommentV1:
      description: "A comment or reply; deleted comments retain their position without\
