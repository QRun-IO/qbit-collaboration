- key: process:collaborationCreateFeatureSettings;slot:help
  summary: "Create editable feature settings from your current configuration."
  content: |
    Run Create rows from configuration in {{label:collaboration_feature_setting}} when the table is empty. Review the proposed settings before continuing. You need collaboration administrator access.

    The action creates the settings already declared by your configuration. It does not overwrite existing rows. After creating rows, edit them to change feature availability; saved settings override the code configuration.
